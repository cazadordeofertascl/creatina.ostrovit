<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando Oferta...</title>
    
    <!-- Meta Pixel Code -->
    <script>

    <style>
        body {
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loader-container {
            text-align: center;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 320px;
            width: 80%;
        }
        .text {
            color: #333333;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 20px;
        }
        .progress-bar {
            background-color: #eeeeee;
            border-radius: 4px;
            position: relative;
            height: 6px;
            width: 100%;
            overflow: hidden;
        }
        .progress-line {
            background-color: #3483fa;
            height: 100%;
            width: 0;
            border-radius: 4px;
            animation: load 2.5s ease-in-out forwards;
        }
        @keyframes load {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="text">Redireccionando a Mercado Libre...</div>
        <div class="progress-bar">
            <div class="progress-line"></div>
        </div>
    </div>

    <script>
        // Retraso de 2.8 segundos para asegurar que el píxel de Meta se dispare completamente
        // antes de realizar la redirección, protegiendo además el flujo de los bots de revisión.
        setTimeout(function() {
            window.location.href = "https://meli.la/1sYmMBs";
        }, 2800);
    </script>

</body>
</html>
